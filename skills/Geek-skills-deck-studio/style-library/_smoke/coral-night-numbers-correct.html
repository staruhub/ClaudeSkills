<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>珊瑚夜色数字页 - 正确示例</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1280px;
            height: 720px;
            background: #1A1A1A;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'Impact', 'Arial Black', sans-serif;
        }
        .hero-number {
            font-size: 180px;
            font-weight: 900;
            color: #FF7F50;
            line-height: 0.9;
            text-align: center;
        }
        .conclusion {
            font-size: 28px;
            color: #F5F0E6;
            margin-top: 40px;
            font-family: 'Arial', sans-serif;
            font-weight: 300;
            text-align: center;
        }
        .aux-number {
            position: absolute;
            bottom: 60px;
            right: 80px;
            font-size: 36px;
            color: #B0B0B0;
            font-weight: 300;
        }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <div class="hero-number">42%</div>
        <div class="conclusion">增长来自新用户</div>
    </div>
    <div class="aux-number">+18% YoY</div>
</body>
</html>

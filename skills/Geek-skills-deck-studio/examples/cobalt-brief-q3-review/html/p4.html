<!doctype html><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
html,body{width:1280px;height:720px;overflow:hidden;}
body{background:#F6F1E8;color:#111111;font-family:"PingFang SC","Hiragino Sans GB",sans-serif;position:relative;}
.top{position:absolute;left:100px;right:100px;top:60px;display:flex;justify-content:space-between;align-items:center;z-index:5;}
.kick{font-size:12px;letter-spacing:.2em;color:#0047AB;font-weight:700;text-transform:uppercase;}
.brand{font-size:11px;letter-spacing:.18em;color:#888888;}
.foot{position:absolute;left:100px;right:100px;bottom:80px;border-top:2px solid #0047AB;padding-top:16px;display:flex;justify-content:space-between;align-items:center;z-index:5;}
.date{font-size:14px;font-weight:700;color:#0047AB;}
.pg{font-size:13px;color:#888888;}
.stage{position:absolute;left:100px;right:100px;top:140px;bottom:160px;z-index:2;display:flex;flex-direction:column;}
.h{font-weight:900;letter-spacing:-.01em;line-height:1.15;color:#0047AB;}
.h-black{font-weight:900;letter-spacing:-.01em;line-height:1.15;color:#111111;}
.subtitle{font-weight:400;color:#111111;line-height:1.6;font-size:20px;margin-top:48px;}
.body{font-weight:400;color:#111111;line-height:1.65;font-size:17px;}
.light{color:#888888;}
.line{height:2px;background:#E8E8E8;margin:24px 0;}
.card{background:#FFF;padding:28px 32px;border:1px solid #E8E8E8;}
.number{font-family:"DIN Alternate","SF Mono",monospace;font-weight:700;font-feature-settings:"tnum";}
</style><body>
<div class="top"><span class="kick">02 市场份额 · Data</span><span class="brand">Q3 STRATEGIC REVIEW</span></div>
<div class="stage">
  <div class="h" style="font-size:52px;margin-bottom:56px;">市场份额提升至行业第二位</div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:32px;margin-bottom:40px;">
    
      <div class="card">
        <div class="body" style="font-size:15px;color:#888888;margin-bottom:16px;">行业排名</div>
        <div class="h number" style="font-size:56px;color:#0047AB;">#2</div>
        <div class="light" style="font-size:13px;margin-top:12px;">from #3 in Q2</div>
      </div>
    
      <div class="card">
        <div class="body" style="font-size:15px;color:#888888;margin-bottom:16px;">市场份额</div>
        <div class="h number" style="font-size:56px;color:#0047AB;">18.4%</div>
        <div class="light" style="font-size:13px;margin-top:12px;">+2.7 pts vs Q2</div>
      </div>
    
      <div class="card">
        <div class="body" style="font-size:15px;color:#888888;margin-bottom:16px;">客户数量</div>
        <div class="h number" style="font-size:56px;color:#0047AB;">1,847</div>
        <div class="light" style="font-size:13px;margin-top:12px;">+312 new accounts</div>
      </div>
    
  </div>
  <div class="body" style="font-size:16px;line-height:1.75;">
    <div style="margin-bottom:12px;"><strong>关键进展：</strong></div>
    <div>• 核心产品线市占率从 15.7% 提升至 18.4%，超越 CompetitorB</div>
    <div>• 三个战略行业（金融、制造、零售）的渗透率均实现双位数增长</div>
    <div>• NPS（净推荐值）从 42 上升至 51，客户满意度显著提升</div>
  </div>
</div>
<div class="foot"><span class="date">Q3 2026</span><span class="pg">04</span></div>
</body>
